---

- name: install jvm
  pkgng:
    name:
      - '{{ freebsd_jdk_pkg }}'
    state: '{% if jvm_upgrade | bool %}latest{% else %}present{% endif %}'
  when: not installed_java_version | default(False) or installed_java_version != jvm_java_version or jvm_upgrade | bool

- name: show java opts
  debug:
    msg: '{{ prop.key }}={{ prop.value }}'
  loop: '{{ jvm_net_opts | combine(jvm_proxy_opts) | dict2items }}'
  loop_control:
    loop_var: prop

- name: get default java
  command: java -XshowSettings:properties --version
  register: javavers
  changed_when: False
  check_mode: False
  environment:
    JAVA_VERSION: '{{ jvm_java_version }}'

- name: set jvm_dir
  set_fact:
    jvm_dir: '{{ javavers.stderr_lines | select("match","^ *java\.home =") | first | regex_replace("^.*= *","") }}'

- name: java_opts
  set_fact:
    this_jvm_java_opts: "{% for opt in jvm_java_opts | combine(jvm_ipv6_opts) | dict2items %} -D{{ opt.key }}={{ opt.value | regex_replace('\"','\\\"') }}{% endfor %}"
    this_jvm_java_selector: '{{ jvm_dir | regex_replace("^.*/","") | regex_replace("\.","_") }}_java'

- name: set java opts for {{ freebsd_jdk_pkg }}
  lineinfile:
    dest: /usr/local/etc/javavm_opts.conf
    line: 'JAVAVM_OPTS_{{ this_jvm_java_selector }}="{{ this_jvm_java_opts }}"'
    regex: '^JAVAVM_OPTS_{{ this_jvm_java_selector }}='
    state: '{% if this_jvm_java_opts != "" %}present{% else %}absent{% endif %}'
